<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>七不思議のタネあかし</title>
<meta name="description" content="学校の七不思議は、ぜんぶ人のしわざだった。うその証言を見やぶって、七つの怪談のタネをあかそう。">
<meta name="theme-color" content="#0d1022">
<meta property="og:type" content="website">
<meta property="og:title" content="七不思議のタネあかし">
<meta property="og:description" content="学校の七不思議は、ぜんぶ人のしわざだった。うその証言を見やぶって、七つの怪談のタネをあかそう。スマホで遊べる推理ゲーム。">
<meta property="og:url" content="https://sokora1705-game.github.io/nanafushigi/">
<meta property="og:image" content="https://sokora1705-game.github.io/nanafushigi/nanafushigi-ogp.png">

<meta name="twitter:description" content="学校の七不思議は、ぜんぶ人のしわざだった。うその証言を見やぶって、七つの怪談のタネをあかそう。">
<meta name="twitter:image" content="https://sokora1705-game.github.io/nanafushigi/nanafushigi-ogp.png">
<style>
:root{
  --bg:#0d1022; --bg2:#151a35; --card:#1c2244; --card2:#242b55;
  --ink:#e9e6f5; --muted:#9a98b8; --moon:#f6e7a8; --accent:#8fd3ff;
  --ok:#8ee6b0; --ng:#ff9a9a; --line:#2f3766;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink)}
body{
  font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
  line-height:1.75; min-height:100vh; min-height:100dvh;
  background:
    radial-gradient(circle at 85% -5%, rgba(246,231,168,.18), transparent 40%),
    linear-gradient(180deg,#0a0c1c 0%, var(--bg) 40%, #111531 100%);
  background-attachment:fixed;
  -webkit-tap-highlight-color:transparent;
}
#app{max-width:520px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:1.75rem;line-height:1.35;letter-spacing:.06em;text-align:center}
h2{font-size:1.3rem;line-height:1.45;margin-bottom:6px}
p{margin:.5em 0}
.muted{color:var(--muted)}
.center{text-align:center}
.small{font-size:.86rem}
.fade{animation:fade .5s ease both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* タイトル */
.night{position:relative;height:210px;margin:6px 0 14px;overflow:hidden;border-radius:18px;
  background:linear-gradient(180deg,#0b0e22,#1a2048)}
.moon{position:absolute;right:34px;top:22px;width:58px;height:58px;border-radius:50%;
  background:var(--moon);box-shadow:0 0 40px 10px rgba(246,231,168,.35)}
.moon::after{content:"";position:absolute;left:-14px;top:-6px;width:58px;height:58px;border-radius:50%;background:#10142e}
.stars{position:absolute;inset:0;background-image:
  radial-gradient(1.5px 1.5px at 12% 20%,#fff,transparent),radial-gradient(1px 1px at 30% 40%,#fff,transparent),
  radial-gradient(1.5px 1.5px at 48% 14%,#fff,transparent),radial-gradient(1px 1px at 64% 30%,#fff,transparent),
  radial-gradient(1px 1px at 20% 55%,#fff,transparent),radial-gradient(1.5px 1.5px at 74% 52%,#fff,transparent);opacity:.7}
.school{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:280px;height:120px;
  background:#070915;border-radius:4px 4px 0 0}
.school::before{content:"";position:absolute;left:50%;top:-34px;transform:translateX(-50%);width:60px;height:40px;background:#070915}
.school::after{content:"";position:absolute;left:50%;top:-26px;transform:translateX(-50%);width:22px;height:22px;border-radius:50%;background:#2a2f52}
.wins{position:absolute;left:18px;right:18px;top:18px;display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
.wins i{display:block;height:20px;background:#1a1f3d;border-radius:2px}
.wins i.lit{background:var(--moon);box-shadow:0 0 12px rgba(246,231,168,.7)}

/* 進みぐあい */
.progress{display:flex;gap:6px;justify-content:center;margin:2px 0 14px}
.progress span{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:.8rem;
  background:var(--bg2);border:1px solid var(--line);color:var(--muted)}
.progress span.done{background:var(--moon);color:#2a2410;border-color:var(--moon)}
.progress span.now{border-color:var(--accent);color:var(--ink);box-shadow:0 0 0 2px rgba(143,211,255,.25)}

.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.tale{background:linear-gradient(180deg,#1b1f3f,#171b37);border-color:#3a3f74}
.tale .label{font-size:.78rem;letter-spacing:.15em;color:var(--moon)}
.case-no{font-size:.85rem;color:var(--accent);letter-spacing:.12em}
.pic{font-size:2.4rem;text-align:center;line-height:1.2;margin:4px 0}

/* 証言カード */
.wlist{display:flex;flex-direction:column;gap:10px;margin:10px 0}
.witness{display:block;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;
  background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 14px;transition:.15s}
.witness .who{font-size:.85rem;color:var(--muted)}
.witness .who b{color:var(--ink);font-size:1rem;margin-right:4px}
.witness .say{margin-top:2px}
.witness.sel{border-color:var(--accent);background:var(--card2)}
.witness.cleared{opacity:.5;cursor:default}
.witness.cleared .who::after{content:"　うそはついていない";color:var(--ok);font-size:.8rem}
.witness.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}

.hint{border-color:#6b5a2a;background:#2a2516}
.hint b{color:var(--moon)}

/* タネあかし */
.reveal h3{font-size:.85rem;letter-spacing:.12em;color:var(--moon);margin-top:12px}
.reveal h3:first-child{margin-top:0}
.lie{background:#2b1d2a;border:1px solid #5a3550;border-radius:12px;padding:10px 12px;margin-top:6px}
.lie .x{color:var(--ng)}
.lie .o{color:var(--ok)}

/* 手紙 */
.letter{background:#f4ecd8;color:#3a3020;border-radius:6px;padding:22px 20px;margin:14px 0;
  box-shadow:0 8px 30px rgba(0,0,0,.4);font-family:"Hiragino Mincho ProN","Yu Mincho",serif;line-height:2}
.letter p{margin:.8em 0}
.letter .sign{text-align:right}
.eighth{text-align:center;border:1px dashed var(--moon);border-radius:14px;padding:16px;margin:16px 0;color:var(--moon)}

/* ボタン */
.actions{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.btn{display:block;width:100%;text-align:center;text-decoration:none;font:inherit;font-weight:bold;cursor:pointer;
  padding:14px 16px;border-radius:999px;border:1px solid var(--line);background:var(--bg2);color:var(--ink)}
.btn.primary{background:var(--moon);color:#2a2410;border-color:var(--moon)}
.btn.x{background:#000;color:#fff;border-color:#444}
.btn:disabled{opacity:.4;cursor:default}
.btn:active:not(:disabled){transform:scale(.98)}
.result{font-size:1.05rem}
.result b{color:var(--moon);font-size:1.3rem}
</style>
</head>
<body>
<main id="app"></main>

<script>
/* =========================================================
   7つの事件
   ・tale：怪談の説明（この中の事実と食いちがう証言をした人が犯人）
   ・culprit：犯人の番号（0〜2）
   ・lie：うそと事実の食いちがい
   ========================================================= */
const CASES = [
{
  title:'動く人体模型', icon:'🦴',
  tale:'夜7時、理科室の人体模型が、3階の6年2組の前の廊下に立っていたという。<br>でもこの模型は、前の日に左足が外れてしまい、修理のため左足だけ理科の先生の机にしまってあった。',
  witnesses:[
    {name:'宮本ゆい', role:'6年1組', say:'7時ごろ、6年2組の前の廊下に、白っぽい人かげが立っていたの。'},
    {name:'大川そうた', role:'6年2組', say:'模型が、両足でスタスタ階段を上がっていくのを見たんだ！'},
    {name:'森ひなた', role:'5年', say:'模型の頭に、赤いハチマキがしめてあったよ。'},
  ],
  culprit:1,
  hint:'怪談の説明に、その夜の模型の<b>体のこと</b>が書いてあったね。その体ではできないことを言っている人は？',
  lie:{x:'「両足でスタスタ階段を上がっていった」', o:'模型の左足は、先生の机の中。両足で歩けるはずがない。'},
  why:'あしたはクラス対抗リレー。6年2組のみんなを元気づけたくて、模型に赤いハチマキをしめて「応援団長」にしようと思いついた。',
  how:'放課後、友だちと2人で模型をかかえ、そっと階段を上がって教室の前に立たせた。とちゅうで守衛の古川さんに会ったけれど、古川さんは「落とすなよ」と笑っただけだった。「模型が歩いた」と話を大きくしたのは、自分たちが運んだとばれないため。',
},
{
  title:'夜中のピアノ', icon:'🎹',
  tale:'夜7時、だれもいないはずの校舎から、ピアノの曲が聞こえてきた。<br>けれど音楽室のピアノは、あしたの合唱コンクールのため、昼のうちに体育館の舞台へ運ばれていた。',
  witnesses:[
    {name:'石田れん', role:'5年', say:'体育館の前を通ったら、中からピアノの音がしたよ。'},
    {name:'野村さき', role:'6年', say:'同じところを、何回も何回もくり返していたの。'},
    {name:'水野あおい', role:'6年', say:'音楽室をのぞいたら、ピアノのふたが開いていたんだ。'},
  ],
  culprit:2,
  hint:'その夜、ピアノは<b>どこに</b>あった？　説明を読みなおそう。',
  lie:{x:'「音楽室のピアノのふたが開いていた」', o:'ピアノは昼のうちに体育館へ。その夜の音楽室に、ピアノはなかった。'},
  why:'あおいは合唱コンクールの伴奏係。本番でまちがえるのがこわくて、本番と同じ舞台のピアノで、こっそり練習しておきたかった。',
  how:'守衛の古川さんにたのんで、体育館を30分だけ開けてもらった。苦手なところを何度もくり返したのが「夜中のピアノ」の正体。「音楽室で見た」とうそをついたのは、体育館での練習を秘密にしておきたかったから。',
},
{
  title:'目が動く肖像画', icon:'🖼️',
  tale:'図書室の「初代校長の肖像画」の目が、夕方ぎょろりと動くという。<br>肖像画は額縁がこわれて修理に出していて、今は絵の紙だけが、壁の古い換気口の上にテープで貼ってある。',
  witnesses:[
    {name:'小林みお', role:'図書委員・5年', say:'金色の額縁が、カタカタゆれていたんだよ。'},
    {name:'上田かいと', role:'6年', say:'目が動いたのは、図書室が閉まる5時の少し前だった。'},
    {name:'中島りこ', role:'4年', say:'絵の目のあたりで、何かが黄色く光ったの。'},
  ],
  culprit:0,
  hint:'肖像画は今、<b>どんなすがた</b>で壁にある？',
  lie:{x:'「金色の額縁がカタカタゆれていた」', o:'額縁は修理中。壁にあるのは、テープで貼った絵の紙だけ。'},
  why:'校庭で、雨にぬれた子ネコを見つけた。飼い主が見つかるまで、どこかにかくしてあげたかった。',
  how:'肖像画のうしろの換気口に、タオルをしいて子ネコをかくまった。子ネコが動くと紙がふくらんで目が動いたように見え、紙の小さな穴から子ネコの目が黄色く光った。「こわい肖像画」のうわさを広めたのは、だれも近づかないようにするため。いつのまにか、換気口の前にはキャットフードが置かれるようになった。夜の図書室を見回るのは、守衛の古川さんだけだ。',
},
{
  title:'水が流れるトイレ', icon:'🚽',
  tale:'夕方6時、3階のトイレから、だれもいないのに水の流れる音がする。<br>そのトイレは今週、水道工事のため個室の「流す」レバーがすべて止められていて、水が出るのは手洗い場の水道だけだ。',
  witnesses:[
    {name:'原田ゆうま', role:'5年', say:'6時ちょうどに音がして、10分くらいで止まるんだ。'},
    {name:'松本ちひろ', role:'生き物係・6年', say:'個室の中で、ジャーッて流す音が何度もしたの。'},
    {name:'岡田こうき', role:'4年', say:'トイレの前の廊下に、水のしずくが点々と落ちていた。'},
  ],
  culprit:1,
  hint:'工事中のトイレで、<b>水が出るのはどこだけ</b>だった？',
  lie:{x:'「個室の中で、ジャーッと流す音がした」', o:'個室のレバーは工事で止まっている。水が出るのは手洗い場だけ。'},
  why:'校舎裏の古い池が、来月うめ立てられると聞いた。池にすむメダカたちを、なんとか助けたかった。',
  how:'メダカを空き教室の水そうにうつし、毎日6時、3階の手洗い場でバケツに水をくんで水を替えていた。廊下のしずくはバケツからこぼれた水。「個室で流す音」と言ったのは、手洗い場を調べられないため。6時は守衛の古川さんが3階を見回る時間なのに、なぜか一度も見つからなかった。',
},
{
  title:'増える階段', icon:'🪜',
  tale:'西階段は、ふだんは12段。ところが夜に数えると、13段あるという。<br>その週の西階段は工事つづきで、手すりはペンキぬりたて、1階の入口は防火シャッターが下りたまま、2階の踊り場には新しい掲示板がとりつけられたところだった。',
  witnesses:[
    {name:'西村けんと', role:'演劇部・6年', say:'1階から上がりながら数えたら、13段あった！'},
    {name:'高橋まな', role:'5年', say:'2階から下りていったら、いちばん下の段だけ、ふみ心地がちがった。'},
    {name:'藤井そら', role:'4年', say:'次の朝に数えたら、ちゃんと12段にもどっていたよ。'},
  ],
  culprit:0,
  hint:'その週、西階段には<b>どこから</b>入れた？',
  lie:{x:'「1階から上がりながら数えた」', o:'1階の入口は防火シャッターでふさがれていた。1階からは入れない。'},
  why:'文化祭の劇『十三段目のひみつ』のために、本物そっくりの木の段を作った。お客さんが本物とまちがえるか、どうしてもためしてみたかった。',
  how:'夕方、2階から木の段を運び下ろして、階段のいちばん下に置いた。いいかげんな話で怪談をもりあげたせいで、入れないはずの1階から上がったことにしてしまった。次の朝、段を回収しに行くと、段はもう階段のわきに片づけてあった。だれが片づけたのかは、わからない。',
},
{
  title:'理科室で光る何か', icon:'✨',
  tale:'夜、理科室の中で、青白い光がちらちら光るという。<br>その週の理科室は、週末の研究発表会の準備中。実験台にはビーカーがならび、窓という窓には黒い暗幕がしめきられ、黒板には先生のかいた星座の図が残っていた。',
  witnesses:[
    {name:'青木ななみ', role:'5年', say:'理科室のドアのすき間から、青い光がもれていたの。'},
    {name:'坂本はると', role:'4年', say:'光は、小さな点がたくさん集まったみたいだった。'},
    {name:'村上いつき', role:'科学クラブ・6年', say:'校庭から見上げたら、理科室の窓の中で光が動いていたよ。'},
  ],
  culprit:2,
  hint:'理科室の窓は、<b>外から中が見える</b>状態だった？',
  lie:{x:'「校庭から、窓の中で光が動いているのが見えた」', o:'窓は暗幕で全部しめきられていた。外から中の光は見えない。'},
  why:'同じクラスの友だちが、長く入院している。病室から星が見られないと聞いて、光る星空をプレゼントしたかった。',
  how:'光る絵の具で、大きな紙に星座をかいた。光りぐあいを確かめるには、まっくらな理科室がぴったり。「校庭から見た」と言ったのは、自分が理科室の中にいたことをかくすため。守衛の古川さんは、その週だけ、なぜか理科室の見回りを最後に回していた。星空は今、病室の天井で光っている。',
},
{
  title:'体育館で弾むボール', icon:'🏀',
  tale:'夜7時、体育館から「ダン、ダン」とボールの弾む音がする。<br>その日の体育館は、昼に床のワックスがけが終わったばかり。舞台には合唱コンクールのひな段が組まれ、ボールは空気の点検で、ひとつ残らず業者に出されていた。',
  witnesses:[
    {name:'山口しおん', role:'6年', say:'音はゆっくりで、ときどき止まって、また始まったよ。'},
    {name:'斎藤ふうか', role:'バスケ部・6年', say:'体育館のボールかごから、ボールが1個へっていたの。'},
    {name:'吉田つばさ', role:'5年', say:'体育館の窓に、2人分の影がうつっていた。'},
  ],
  culprit:1,
  hint:'その日、体育館に<b>ボールはいくつ</b>あった？',
  lie:{x:'「ボールかごから、ボールが1個へっていた」', o:'その日、体育館のボールは全部点検に出ていた。かごはからっぽ。'},
  why:'来週はクラスのボール大会。ドリブルが苦手な友だちが「みんなに笑われたくない」となやんでいた。',
  how:'自分のボールを家から持ってきて、夜の体育館で友だちとこっそり特訓した。ゆっくりで、ときどき止まる音は、練習中の友だちのドリブル。「かごからへっていた」とうそをついたのは、友だちとの約束を守って、特訓を秘密にするため。体育館のカギは、守衛の古川さんが開けてくれた。',
},
];

const FINALE = {
  intro:'七つめのタネをあかした次の朝。新聞部の部室の机に、古い封筒が置いてあった。中には、色あせた白黒写真が1枚と、手紙が入っていた。写真には、人体模型をかこんで笑う7人の子どもがうつっている。',
  letter:[
    '新聞部のみなさんへ',
    '七つのタネあかし、おみごとでした。じつは、わたしはぜんぶ知っていました。夜の学校を見回っているのは、わたしですからね。',
    'ないしょの話をひとつ。五十年前、この学校の七不思議を作ったのは、わたしたちのクラスです。模型を運んだのも、夜にピアノをひいたのも、みんな、だれかのためでした。写真のまんなかで模型をかかえているのが、わたしです。',
    '今年のみなさんは、同じ七つの怪談に、また新しい「だれかのため」をつめこんでくれた。それがうれしくて、つい、見のがしてしまいました。',
    '金曜日で、わたしもこの学校を卒業します。子ネコは、わたしが家に連れて帰ります。名前はもう決めました。「校長」です。',
    '七不思議を、これからもよろしく。',
  ],
  sign:'守衛　古川',
  eighth:'八つめの不思議<br><b>この学校の怪談は、いつも、だれかを思う気持ちでできている。</b>',
};

/* =========================================================
   ゲームの進行
   ========================================================= */
const app = document.getElementById('app');
const S = { screen:'title', i:0, sel:null, cleared:[], misses:0, caseMisses:0, hintOn:false, solved:0 };

function progressHTML(){
  return `<div class="progress" aria-label="進みぐあい">${CASES.map((c,k)=>
    `<span class="${k<S.solved?'done':''} ${k===S.i&&S.screen!=='finale'&&S.screen!=='result'?'now':''}">${k+1}</span>`).join('')}</div>`;
}

function rTitle(){
  return `<div class="fade">
    <div class="night"><div class="stars"></div><div class="moon"></div>
      <div class="school"><div class="wins">${'<i></i>'.repeat(7)}</div></div></div>
    <h1>七不思議の<br>タネあかし</h1>
    <p class="center muted" style="margin-top:10px">学校の七不思議は、<br>ぜんぶ<b style="color:var(--moon)">人のしわざ</b>だった。</p>
    <div class="box small">
      <p>● 1問ごとに、怪談の説明と、目撃者3人の証言を読む。</p>
      <p>● 3人のうち<b>1人だけがうそ</b>をついている。その人が、怪談をしかけた犯人。</p>
      <p>● うそは、<b>怪談の説明と食いちがう</b>ところで見やぶれる。</p>
    </div>
    <div class="actions"><button class="btn primary" data-act="start">夜の学校へ ▶</button></div>
  </div>`;
}

function rIntro(){
  return `<div class="fade">
    <div class="pic">🌙🏫</div>
    <div class="box">
      <p>きみは新聞部の新入部員。</p>
      <p>部長から最初の仕事をわたされた。<br>「学校新聞の特集は『七不思議』。ただの怪談じゃつまらない。<b>タネをあかしてきて</b>」</p>
      <p>うわさでは、七つの怪談には、どれも目撃者がいるらしい。<br>でも、その中には、ほんとうのことを言っていない人がまじっている……。</p>
    </div>
    <div class="actions"><button class="btn primary" data-act="toCase">ひとつめの怪談へ ▶</button></div>
  </div>`;
}

function rCase(){
  const c = CASES[S.i];
  return `<div class="fade">
    ${progressHTML()}
    <div class="case-no center">七不思議 その${'一二三四五六七'[S.i]}</div>
    <h2 class="center">${c.icon} ${c.title}</h2>
    <div class="box tale"><div class="label">怪談</div><p>${c.tale}</p></div>
    <p class="small muted">目撃者の証言（うそをついている1人をえらぼう）</p>
    <div class="wlist">${c.witnesses.map((w,k)=>{
      const cl = S.cleared.includes(k);
      return `<button class="witness ${S.sel===k?'sel':''} ${cl?'cleared':''}" data-w="${k}" ${cl?'disabled':''}>
        <div class="who"><b>${w.name}</b>${w.role}</div>
        <div class="say">「${w.say}」</div></button>`;}).join('')}</div>
    ${S.hintOn?`<div class="box hint fade"><p>💡 <b>ヒント</b></p><p>${c.hint}</p></div>`:''}
    <div class="actions"><button class="btn primary" data-act="accuse" ${S.sel===null?'disabled':''}>この人がしかけた犯人だ！</button></div>
  </div>`;
}

function rReveal(){
  const c = CASES[S.i], w = c.witnesses[c.culprit];
  const last = S.i === CASES.length-1;
  return `<div class="fade">
    ${progressHTML()}
    <div class="pic">${c.icon}</div>
    <h2 class="center">タネあかし<br><span class="small muted">${c.title}</span></h2>
    <div class="box reveal">
      <h3>だれが</h3>
      <p><b>${w.name}</b>（${w.role}）</p>
      <div class="lie small"><span class="x">うそ：</span>${c.lie.x}<br><span class="o">事実：</span>${c.lie.o}</div>
      <h3>なぜ</h3><p>${c.why}</p>
      <h3>どうやって</h3><p>${c.how}</p>
    </div>
    <div class="actions"><button class="btn primary" data-act="next">${last?'七つのタネをあかした ▶':'つぎの怪談へ ▶'}</button></div>
  </div>`;
}

function rFinale(){
  return `<div class="fade">
    <div class="pic">✉️</div>
    <p>${FINALE.intro}</p>
    <div class="letter">${FINALE.letter.map(l=>`<p>${l}</p>`).join('')}<p class="sign">${FINALE.sign}</p></div>
    <p class="muted small">そういえば、七つの事件のどれにも、守衛の古川さんがいた。模型を運ぶ子に笑いかけ、体育館のカギを開け、換気口の前にキャットフードを置き、木の段を片づけ、見回りの時間をずらして——。</p>
    <div class="eighth">${FINALE.eighth}</div>
    <div class="actions"><button class="btn primary" data-act="result">けっかを見る ▶</button></div>
  </div>`;
}

function rankOf(m){
  if (m===0) return '夜の学校の名探偵';
  if (m<=3) return '新聞部のエース記者';
  if (m<=7) return '七不思議ハンター';
  return 'こわがりの見習い記者';
}

function shareURL(){
  const lines = [
    '『七不思議のタネあかし』で、七つの怪談のタネをぜんぶあかしました！',
    `まちがい ${S.misses}回／称号：${rankOf(S.misses)}`,
    '#七不思議のタネあかし',
  ];
  const page = /^https?:/.test(location.href) ? location.href.split(/[?#]/)[0] : '';
  return 'https://x.com/intent/tweet?text=' + encodeURIComponent(lines.join('\n')) + (page?'&url='+encodeURIComponent(page):'');
}

function rResult(){
  return `<div class="fade center">
    <div class="night" style="height:170px"><div class="stars"></div><div class="moon"></div>
      <div class="school"><div class="wins">${'<i class="lit"></i>'.repeat(7)}</div></div></div>
    <h2>七不思議、ぜんぶタネあかし！</h2>
    <div class="box result">
      <p>まちがい <b>${S.misses}</b> 回</p>
      <p>称号：<b>${rankOf(S.misses)}</b></p>
    </div>
    <div class="actions">
      <a class="btn x" href="${shareURL()}" target="_blank" rel="noopener" data-share>𝕏 結果をシェア</a>
      <p class="small muted">シェア文には、答えは入りません。</p>
      <button class="btn primary" data-act="restart">もういちど はじめから</button>
    </div>
  </div>`;
}

function render(){
  const fn = {title:rTitle, intro:rIntro, case:rCase, reveal:rReveal, finale:rFinale, result:rResult}[S.screen];
  app.innerHTML = fn();
  window.scrollTo({top:0});
}

function openCase(){ S.screen='case'; S.sel=null; S.cleared=[]; S.caseMisses=0; S.hintOn=false; render(); }

app.addEventListener('click', e => {
  const w = e.target.closest('[data-w]');
  if (w && !w.disabled){
    S.sel = +w.dataset.w;
    app.querySelectorAll('.witness').forEach(b=>b.classList.toggle('sel', b===w));
    app.querySelector('[data-act="accuse"]').disabled = false;
    return;
  }
  const a = e.target.closest('[data-act]');
  if (!a) return;
  switch (a.dataset.act){
    case 'start': S.screen='intro'; render(); break;
    case 'toCase': S.i=0; openCase(); break;
    case 'accuse': {
      if (S.sel===null) return;
      const c = CASES[S.i];
      if (S.sel === c.culprit){ S.solved = S.i+1; S.screen='reveal'; render(); }
      else {
        const k = S.sel;
        S.misses++; S.caseMisses++; S.cleared.push(k); S.sel=null; S.hintOn=true;
        render();
        const b = app.querySelector(`[data-w="${k}"]`);
        if (b){ b.classList.add('shake'); }
      }
      break;
    }
    case 'next':
      if (S.i < CASES.length-1){ S.i++; openCase(); }
      else { S.screen='finale'; render(); }
      break;
    case 'result': S.screen='result'; render(); break;
    case 'restart': Object.assign(S,{screen:'title', i:0, sel:null, cleared:[], misses:0, caseMisses:0, hintOn:false, solved:0}); render(); break;
  }
});

render();
</script>
</body>
</html>
