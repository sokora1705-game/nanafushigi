<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>七不思議のタネあかし</title>
<meta name="description" content="学校の七不思議は、ぜんぶ人のしわざだった。うその証言を見やぶって、七つの怪談のタネをあかそう。">
<meta name="theme-color" content="#0d1022">
<meta property="og:type" content="website">
<meta property="og:title" content="七不思議のタネあかし">
<meta property="og:description" content="学校の七不思議は、ぜんぶ人のしわざだった。うその証言を見やぶって、七つの怪談のタネをあかそう。スマホで遊べる推理ゲーム。">
<meta property="og:url" content="https://sokora1705-game.github.io/nanafushigi/">
<meta property="og:image" content="https://sokora1705-game.github.io/nanafushigi/nanafushigi-ogp.png">

<meta name="twitter:description" content="学校の七不思議は、ぜんぶ人のしわざだった。うその証言を見やぶって、七つの怪談のタネをあかそう。">
<meta name="twitter:image" content="https://sokora1705-game.github.io/nanafushigi/nanafushigi-ogp.png">
<style>
:root{
  --bg:#0d1022; --bg2:#151a35; --card:#1c2244; --card2:#242b55;
  --ink:#e9e6f5; --muted:#9a98b8; --moon:#f6e7a8; --accent:#8fd3ff;
  --ok:#8ee6b0; --ng:#ff9a9a; --line:#2f3766;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink)}
body{
  font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
  line-height:1.75; min-height:100vh; min-height:100dvh;
  background:
    radial-gradient(circle at 85% -5%, rgba(246,231,168,.18), transparent 40%),
    linear-gradient(180deg,#0a0c1c 0%, var(--bg) 40%, #111531 100%);
  background-attachment:fixed;
  -webkit-tap-highlight-color:transparent;
}
#app{max-width:520px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:1.75rem;line-height:1.35;letter-spacing:.06em;text-align:center}
h2{font-size:1.3rem;line-height:1.45;margin-bottom:6px}
p{margin:.5em 0}
.muted{color:var(--muted)}
.center{text-align:center}
.small{font-size:.86rem}
.fade{animation:fade .5s ease both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* タイトル */
.night{position:relative;height:210px;margin:6px 0 14px;overflow:hidden;border-radius:18px;
  background:linear-gradient(180deg,#0b0e22,#1a2048)}
.moon{position:absolute;right:34px;top:22px;width:58px;height:58px;border-radius:50%;
  background:var(--moon);box-shadow:0 0 40px 10px rgba(246,231,168,.35)}
.moon::after{content:"";position:absolute;left:-14px;top:-6px;width:58px;height:58px;border-radius:50%;background:#10142e}
.stars{position:absolute;inset:0;background-image:
  radial-gradient(1.5px 1.5px at 12% 20%,#fff,transparent),radial-gradient(1px 1px at 30% 40%,#fff,transparent),
  radial-gradient(1.5px 1.5px at 48% 14%,#fff,transparent),radial-gradient(1px 1px at 64% 30%,#fff,transparent),
  radial-gradient(1px 1px at 20% 55%,#fff,transparent),radial-gradient(1.5px 1.5px at 74% 52%,#fff,transparent);opacity:.7}
.school{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:280px;height:120px;
  background:#070915;border-radius:4px 4px 0 0}
.school::before{content:"";position:absolute;left:50%;top:-34px;transform:translateX(-50%);width:60px;height:40px;background:#070915}
.school::after{content:"";position:absolute;left:50%;top:-26px;transform:translateX(-50%);width:22px;height:22px;border-radius:50%;background:#2a2f52}
.wins{position:absolute;left:18px;right:18px;top:18px;display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
.wins i{display:block;height:20px;background:#1a1f3d;border-radius:2px}
.wins i.lit{background:var(--moon);box-shadow:0 0 12px rgba(246,231,168,.7)}

/* 進みぐあい */
.progress{display:flex;gap:5px;justify-content:center;margin:2px 0 14px}
.progress span{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:.8rem;
  background:var(--bg2);border:1px solid var(--line);color:var(--muted)}
.progress span.done{background:var(--moon);color:#2a2410;border-color:var(--moon)}
.progress span.now{border-color:var(--accent);color:var(--ink);box-shadow:0 0 0 2px rgba(143,211,255,.25)}
.progress span.eight{border-style:dashed}
.progress span.miss{background:#5a3550;color:#ffd0e6;border-color:#8a4f78}
.progress span.done.now{color:#2a2410;box-shadow:0 0 0 2px var(--accent)}
.mode-chip{display:block;text-align:center;font-size:.75rem;color:var(--ng);letter-spacing:.1em;margin:-8px 0 8px}

.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.tale{background:linear-gradient(180deg,#1b1f3f,#171b37);border-color:#3a3f74}
.tale .label{font-size:.78rem;letter-spacing:.15em;color:var(--moon)}
.case-no{font-size:.85rem;color:var(--accent);letter-spacing:.12em}
.pic{font-size:2.4rem;text-align:center;line-height:1.2;margin:4px 0}

/* 決め手を光らせる */
mark.key{color:#ffe680;font-weight:bold;border-radius:4px;padding:0 3px;
  background:rgba(255,224,102,.16);box-shadow:inset 0 -2px 0 rgba(255,224,102,.75);
  animation:keyglow 1.6s ease .4s both}
@keyframes keyglow{
  0%{color:inherit;background:transparent;box-shadow:none}
  40%{color:#fff6c2;background:rgba(255,224,102,.42);box-shadow:0 0 18px rgba(255,224,102,.85)}
  100%{color:#ffe680;background:rgba(255,224,102,.16);box-shadow:inset 0 -2px 0 rgba(255,224,102,.75)}
}
.tale.again .label::after{content:"　決め手は、ここ";color:var(--accent)}

/* 顔アイコン */
.face{width:56px;height:56px;flex:none;border-radius:50%;display:block;overflow:hidden}
.face.big{width:120px;height:120px;margin:4px auto}
.face.glowring{box-shadow:0 0 0 3px var(--moon),0 0 24px rgba(246,231,168,.8);animation:ring 1.6s ease .3s both}
@keyframes ring{0%{box-shadow:none}50%{box-shadow:0 0 0 5px var(--moon),0 0 40px rgba(246,231,168,1)}}

.facewrap{flex:none;cursor:zoom-in;border-radius:50%;position:relative}
.facewrap::after{content:"🔍";position:absolute;right:-4px;bottom:-4px;font-size:.7rem;opacity:.75}
.zoom{position:fixed;inset:0;z-index:20;background:rgba(5,6,15,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;animation:fade .2s ease both}
.zoom .face{width:min(78vw,300px);height:min(78vw,300px)}
.zoom p{color:var(--ink)}
.fail{border-color:#8a4f78;background:#2b1d2a;text-align:center;color:#ffd0e6}
.tries{border-color:#8a4f78;background:#2b1d2a;color:#ffd0e6}

/* 証言カード */
.wlist{display:flex;flex-direction:column;gap:10px;margin:10px 0}
.witness{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;
  background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 14px;transition:.15s}
.witness .wtext{flex:1;min-width:0}
.witness .who{font-size:.85rem;color:var(--muted)}
.witness .who b{color:var(--ink);font-size:1rem;margin-right:4px}
.witness .say{margin-top:2px}
.witness.sel{border-color:var(--accent);background:var(--card2)}
.witness.cleared{opacity:.5;cursor:default}
.witness.cleared .who::after{content:"　うそはついていない";color:var(--ok);font-size:.8rem}
.witness.cleared.nope .who::after{content:"　ちがうようだ"}
.witness.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}

.hint{border-color:#6b5a2a;background:#2a2516}
.hint b{color:var(--moon)}

/* タネあかし */
.reveal h3{font-size:.85rem;letter-spacing:.12em;color:var(--moon);margin-top:12px}
.reveal h3:first-child{margin-top:0}
.culprit{display:flex;gap:12px;align-items:center}
.lie{background:#2b1d2a;border:1px solid #5a3550;border-radius:12px;padding:10px 12px;margin-top:8px}
.lie .x{color:var(--ng)}
.lie .o{color:var(--ok)}

/* 八つめ：答えのあと */
.trace{list-style:none;display:flex;flex-direction:column;gap:10px}
.trace li{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:.92rem}
.trace li .t{font-size:.78rem;color:var(--accent);letter-spacing:.08em}

/* 手紙 */
.letter{background:#f4ecd8;color:#3a3020;border-radius:6px;padding:22px 20px;margin:14px 0;
  box-shadow:0 8px 30px rgba(0,0,0,.4);font-family:"Hiragino Mincho ProN","Yu Mincho",serif;line-height:2}
.letter p{margin:.8em 0}
.letter .sign{text-align:right}
.eighth{text-align:center;border:1px dashed var(--moon);border-radius:14px;padding:16px;margin:16px 0;color:var(--moon)}

/* ボタン */
.actions{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.btn{display:block;width:100%;text-align:center;text-decoration:none;font:inherit;font-weight:bold;cursor:pointer;
  padding:14px 16px;border-radius:999px;border:1px solid var(--line);background:var(--bg2);color:var(--ink)}
.btn.primary{background:var(--moon);color:#2a2410;border-color:var(--moon)}
.btn.hard{background:#2a1630;border-color:#6b3a6e;color:#ffd0e6}
.btn .sub{display:block;font-size:.75rem;font-weight:normal;opacity:.85}
.btn.x{background:#000;color:#fff;border-color:#444}
.btn:disabled{opacity:.4;cursor:default}
.btn:active:not(:disabled){transform:scale(.98)}
.result{font-size:1.05rem}
.result b{color:var(--moon);font-size:1.3rem}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs><filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="1.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter></defs>
</svg>
<main id="app"></main>

<script>
/* =========================================================
   7つの事件
   ・tale：怪談の説明。[[ ]] でかこんだところが決め手（タネあかしで光る）
   ・culprit：犯人の番号（0〜2）
   ・how：[[ ]] でかこんだところが古川さんの場面（最後の問題のあとで光る）
   ・hard：むずかしいモードで差しかえる中身。2つの事実を組み合わせないと、うそが見やぶれない形。
     その六だけは、手がかりが説明文ではなく犯人の顔の絵の中にある（key がある問題）
   ========================================================= */
const CASES = [
{
  title:'動く人体模型', icon:'🦴',
  hard:{ // 事実A「7時に3階」×事実B「6時半はまだ1階の理科室」
    tale:'夜7時、理科室の人体模型が、[[3階の6年2組の前の廊下に立っていた]]という。<br>理科室は1階のいちばん奥。[[6時半に理科室の前を通った先生は、模型がまだ理科室にあるのを見ている]]。',
    witnesses:[
      {name:'宮本ゆい', role:'6年1組', say:'模型の顔は、6年2組の教室のほうを向いていたよ。'},
      {name:'大川そうた', role:'6年2組', say:'6時半から7時まで、ずっと6年2組の教室にいたけど、廊下にはだれも来なかったよ。'},
      {name:'森ひなた', role:'5年', say:'模型の頭に、赤いハチマキがしめてあったよ。'},
    ],
    culprit:1,
    lie:{x:'「6時半から7時まで、6年2組の前の廊下にはだれも来なかった」', o:'6時半、模型はまだ1階の理科室。7時には6年2組の前。そのあいだに、だれかが模型を運んで廊下に来たはず。'},
  },
  tale:'夜7時、理科室の人体模型が、3階の6年2組の前の廊下に立っていたという。<br>でもこの模型は、[[前の日に左足が外れてしまい、修理のため左足だけ理科の先生の机にしまってあった]]。',
  witnesses:[
    {name:'宮本ゆい', role:'6年1組', say:'7時ごろ、6年2組の前の廊下に、白っぽい人かげが立っていたの。'},
    {name:'大川そうた', role:'6年2組', say:'模型が、両足でスタスタ階段を上がっていくのを見たんだ！'},
    {name:'森ひなた', role:'5年', say:'模型の頭に、赤いハチマキがしめてあったよ。'},
  ],
  culprit:1,
  hint:'怪談の説明に、その夜の模型の<b>体のこと</b>が書いてあったね。その体ではできないことを言っている人は？',
  lie:{x:'「両足でスタスタ階段を上がっていった」', o:'模型の左足は、先生の机の中。両足で歩けるはずがない。'},
  why:'あしたはクラス対抗リレー。6年2組のみんなを元気づけたくて、模型に赤いハチマキをしめて「応援団長」にしようと思いついた。',
  how:'放課後、友だちと2人で模型をかかえて、そっと階段を上がった。[[とちゅうで見回りの守衛さんとすれちがったけれど、「落とすなよ」と言われただけだった]]。教室の前に模型を立たせ、ハチマキをしめて完成。うその証言をしたのは、自分たちが運んだとばれないため。',
},
{
  title:'夜中のピアノ', icon:'🎹',
  hard:{ // 事実A「ピアノは2か所だけ」×事実B「音楽室のピアノは鳴らない」
    tale:'夜7時から30分ほど、だれもいないはずの校舎から、ピアノの曲が聞こえてきた。<br>[[この学校でピアノがあるのは、音楽室と体育館の2か所だけ]]。その日、[[音楽室のピアノは調律のとちゅうで弦が外され、次の日まで音が出ない]]ままだった。',
    witnesses:[
      {name:'石田れん', role:'5年', say:'同じところを、何回も何回もくり返していたよ。'},
      {name:'野村さき', role:'6年', say:'曲は、あしたの合唱コンクールで歌う歌の伴奏だった。'},
      {name:'水野あおい', role:'6年', say:'7時すぎに体育館の前を通ったけど、中はしーんとしてたよ。'},
    ],
    culprit:2,
    lie:{x:'「7時すぎ、体育館の中はしーんとしていた」', o:'ピアノは音楽室と体育館だけ。音楽室のピアノは音が出ない。7時からの曲は、体育館のピアノのはず。'},
  },
  tale:'夜7時、だれもいないはずの校舎から、ピアノの曲が聞こえてきた。<br>けれど音楽室のピアノは、あしたの合唱コンクールのため、[[昼のうちに体育館の舞台へ運ばれていた]]。',
  witnesses:[
    {name:'石田れん', role:'5年', say:'体育館の前を通ったら、中からピアノの音がしたよ。'},
    {name:'野村さき', role:'6年', say:'同じところを、何回も何回もくり返していたの。'},
    {name:'水野あおい', role:'6年', say:'音楽室をのぞいたら、ピアノのふたが開いていたんだ。'},
  ],
  culprit:2,
  hint:'その夜、ピアノは<b>どこに</b>あった？　説明を読みなおそう。',
  lie:{x:'「音楽室のピアノのふたが開いていた」', o:'ピアノは昼のうちに体育館へ。その夜の音楽室に、ピアノはなかった。'},
  why:'あおいは合唱コンクールの伴奏係。本番でまちがえるのがこわくて、本番と同じ舞台のピアノで、こっそり練習しておきたかった。',
  how:'[[守衛の古川さんにたのんで体育館を30分だけ開けてもらい]]、苦手なところを何度もくり返した。それが「夜中のピアノ」の正体。うその証言をしたのは、体育館での練習を秘密にしておきたかったから。',
},
{
  title:'目が動く肖像画', icon:'🖼️',
  hard:{ // 事実A「動いたのは火・木」×事実B「図書室は火・木はカギ」
    tale:'図書室の「初代校長の肖像画」の目が、夕方ぎょろりと動くという。<br>[[目が動いたのは、今週の火曜日と木曜日の夕方]]。図書室は先生の会議のため、[[火曜と木曜はお休みで、一日じゅうカギがかかっている]]。カギは職員室で先生があずかっている。',
    witnesses:[
      {name:'小林みお', role:'図書委員・5年', say:'目が動いたとき、わたし、図書室の中で本をならべてたの。ほんとに動いたんだから！'},
      {name:'上田かいと', role:'6年', say:'火曜日の夕方、図書室の前の廊下で、カサカサって音を聞いたよ。'},
      {name:'中島りこ', role:'4年', say:'木曜日、図書室のドアの小窓からのぞいたら、絵の目が動いたの。'},
    ],
    culprit:0,
    lie:{x:'「目が動いたとき、図書室の中で本をならべていた」', o:'目が動いたのは火曜と木曜。その日の図書室は、一日じゅうカギがかかっている。中にいられたはずがない。'},
  },
  tale:'図書室の「初代校長の肖像画」の目が、夕方ぎょろりと動くという。<br>[[肖像画は額縁がこわれて修理に出していて、今は絵の紙だけ]]が、壁の古い換気口の上にテープで貼ってある。',
  witnesses:[
    {name:'小林みお', role:'図書委員・5年', say:'金色の額縁が、カタカタゆれていたんだよ。'},
    {name:'上田かいと', role:'6年', say:'目が動いたのは、図書室が閉まる5時の少し前だった。'},
    {name:'中島りこ', role:'4年', say:'絵の目のあたりで、何かが黄色く光ったの。'},
  ],
  culprit:0,
  hint:'肖像画は今、<b>どんなすがた</b>で壁にある？',
  lie:{x:'「金色の額縁がカタカタゆれていた」', o:'額縁は修理中。壁にあるのは、テープで貼った絵の紙だけ。'},
  why:'校庭で、雨にぬれた子ネコを見つけた。飼い主が見つかるまで、どこかにかくしてあげたかった。',
  how:'肖像画のうしろの換気口に、タオルをしいて子ネコをかくまった。給食ののこりのパンと、[[古川さんがわけてくれたキャットフード]]で、子ネコはすぐに元気になった。子ネコが動くと紙がふくらんで目が動いたように見え、紙の小さな穴から子ネコの目が黄色く光った。「こわい肖像画」のうわさを広めたのは、だれも近づかないようにするため。',
},
{
  title:'水が流れるトイレ', icon:'🚽',
  hard:{ // 事実A「水が出るのは手洗い場だけ」×事実B「ボタンをおしているあいだだけ出る」
    tale:'夕方6時から10分ほど、3階のトイレから水の流れる音がする。<br>そのトイレは工事中で、[[水が出るのは手洗い場の水道だけ]]。手洗い場の蛇口は新しい型で、[[ボタンをおしているあいだしか水が出ない]]。',
    witnesses:[
      {name:'原田ゆうま', role:'5年', say:'音はいつも、6時ちょうどに始まるんだ。'},
      {name:'松本ちひろ', role:'生き物係・6年', say:'水の音がしてるときにトイレに入ったけど、中にはだれもいなかったよ。'},
      {name:'岡田こうき', role:'4年', say:'トイレの前の廊下に、水のしずくが点々と落ちていた。'},
    ],
    culprit:1,
    lie:{x:'「水の音がしているとき、中にはだれもいなかった」', o:'水が出るのは手洗い場だけ。しかもボタンをおしているあいだだけ。水の音がしているなら、だれかが手洗い場にいたはず。'},
  },
  tale:'夕方6時、3階のトイレから、だれもいないのに水の流れる音がする。<br>そのトイレは今週、水道工事のため[[個室の「流す」レバーがすべて止められていて、水が出るのは手洗い場の水道だけ]]だ。',
  witnesses:[
    {name:'原田ゆうま', role:'5年', say:'6時ちょうどに音がして、10分くらいで止まるんだ。'},
    {name:'松本ちひろ', role:'生き物係・6年', say:'個室の中で、ジャーッて流す音が何度もしたの。'},
    {name:'岡田こうき', role:'4年', say:'トイレの前の廊下に、水のしずくが点々と落ちていた。'},

/* =========================================================
   顔アイコン（名前から髪型・色を決める。override で指定もできる）
   ========================================================= */
const SKINS = ['#f1d2b6','#f6dcc4','#e6bf9c'];
const HAIRC = ['#2a1f18','#3b2a1e','#1c1c24','#5a3b24','#4a2e2e'];
const SHIRTS = ['#4f6bd8','#d86f6f','#5fb38a','#c9a24a','#8a6fd8','#4fb0c6'];
const STYLES = ['short','bob','pony','spiky'];
function hashName(s){ let h=7; for (const ch of s) h = (h*31 + ch.codePointAt(0)) >>> 0; return h; }
function faceSVG(name, o={}, cls=''){
  const h = hashName(name);
  const skin = SKINS[o.skin ?? (h % 3)];
  const hc = o.hc || HAIRC[(h>>3) % HAIRC.length];
  const shirt = o.coat ? '#eef0f4' : SHIRTS[(h>>6) % SHIRTS.length];
  const style = o.hair || (o.adult ? 'short' : STYLES[(h>>9) % STYLES.length]);
  const glasses = o.glasses ?? ((h>>12) % 6 === 0);
  let back='', top='';
  if (style==='bob')   back = `<path d="M12 36 Q11 12 30 12 Q49 12 48 36 L48 46 L41 46 L41 30 L19 30 L19 46 L12 46Z" fill="${hc}"/>`;
  if (style==='pony')  back = `<ellipse cx="47" cy="31" rx="5" ry="10" fill="${hc}"/>`;
  if (style==='spiky') top = `<path d="M13 32 L15 18 L20 22 L23 12 L28 19 L32 11 L36 19 L41 13 L43 22 L47 32 Q42 22 30 22 Q18 22 13 32Z" fill="${hc}"/>`;
  else                 top = `<path d="M13 33 Q12 13 30 13 Q48 13 47 33 Q44 22 30 22 Q16 22 13 33Z" fill="${hc}"/>`;
  const cap = o.cap ? `<path d="M12 25 Q30 6 48 25Z" fill="#26304f"/><rect x="10" y="23" width="40" height="5" rx="2.5" fill="#1b2340"/><circle cx="30" cy="17" r="2.6" fill="#e2c55a"/>` : '';
  const mus = o.mustache ? `<path d="M24 39.5 Q30 36.5 36 39.5 Q30 41.5 24 39.5Z" fill="#a9a9a9"/>` : '';
  const gl = glasses ? `<g fill="none" stroke="#dfe6f5" stroke-width="1.4"><circle cx="24" cy="33" r="4.4"/><circle cx="36" cy="33" r="4.4"/><path d="M28.4 33 L31.6 33"/></g>` : '';
  const collar = o.coat ? `<path d="M19 60 L25 49 L30 55 L35 49 L41 60Z" fill="#cfd5e2"/>` : '';
  const paint = o.paint ? `<g filter="url(#glow)" fill="#8fe6ff"><circle cx="40" cy="38.6" r="2.8"/><circle cx="44.2" cy="35.4" r="2"/><circle cx="38.6" cy="43" r="1.7"/><circle cx="44" cy="41.4" r="1.5"/></g>` : '';
  return `<svg class="face ${cls}" viewBox="0 0 60 60" role="img" aria-label="${name}の顔">
    <circle cx="30" cy="30" r="30" fill="#2a3160"/><g transform="translate(-7.5 -6.6) scale(1.25)">${back}
    <path d="M10 62 Q30 42 50 62Z" fill="${shirt}"/>${collar}
    <circle cx="30" cy="33" r="15.5" fill="${skin}"/>${top}${cap}
    <circle cx="24" cy="33" r="1.8" fill="#222"/><circle cx="36" cy="33" r="1.8" fill="#222"/>
    <ellipse cx="21" cy="38" rx="2.4" ry="1.4" fill="#f2a0a0" opacity=".5"/><ellipse cx="39" cy="38" rx="2.4" ry="1.4" fill="#f2a0a0" opacity=".5"/>
    ${mus}<path d="M26.5 41 Q30 43.5 33.5 41" fill="none" stroke="#7a3b3b" stroke-width="1.3" stroke-linecap="round"/>${gl}${paint}</g>
  </svg>`;
}

const app = document.getElementById('app');
const S = { screen:'title', hard:false, i:0, sel:null, cleared:[], misses:0, hintOn:false, solved:0, tries:0, failed:false, results:[] };

const plain = t => t.replace(/\[\[|\]\]/g, '');
const lit   = t => t.replace(/\[\[(.*?)\]\]/g, '<mark class="key">$1</mark>');
const KANJI = '一二三四五六七';

// むずかしいモードの差しかえを反映した、その問題の中身
function caseOf(i){
  const c = CASES[i];
  return (S.hard && c.hard) ? {...c, ...c.hard, hardCase:true} : c;
}

function progressHTML(){
  const now = S.screen==='eighth' ? 7 : S.i;
  return `<div class="progress" aria-label="進みぐあい">${[...KANJI,'八'].map((k,n)=>
    `<span class="${n<S.solved?(S.results[n]===false?'miss':'done'):''} ${n===now?'now':''} ${n===7?'eight':''}">${n<7?n+1:k}</span>`).join('')}</div>
    ${S.hard?'<span class="mode-chip">むずかしいモード</span>':''}`;
}

function zoomable(name, o, svg){
  return `<span class="facewrap" data-z="${encodeURIComponent(JSON.stringify({name, o}))}" title="タップで大きく">${svg}</span>`;
}
function openZoom(z){
  const {name, o} = JSON.parse(decodeURIComponent(z));
  const el = document.createElement('div');
  el.className = 'zoom';
  el.innerHTML = `${faceSVG(name, o)}<p><b>${name}</b></p><p class="small muted">タップでとじる</p>`;
  el.addEventListener('click', () => el.remove());
  document.body.appendChild(el);
}
function witnessCards(list, faceOf, nopeLabel){
  return `<div class="wlist">${list.map((w,k)=>{
    const cl = S.cleared.includes(k);
    return `<button class="witness ${S.sel===k?'sel':''} ${cl?'cleared':''} ${cl&&nopeLabel?'nope':''}" data-w="${k}" ${cl?'disabled':''}>
      ${faceOf(w,k)}
      <div class="wtext"><div class="who"><b>${w.name}</b>${w.role}</div>${w.say?`<div class="say">「${w.say}」</div>`:''}</div></button>`;}).join('')}</div>`;
}

function triesHTML(){
  return (S.hard && S.tries===1) ? `<div class="box tries small fade">ちがうようだ……。まちがえられるのは、あと1回。</div>` : '';
}
const failHTML = () => S.failed ? `<div class="box fail small">見やぶれなかった……。正解は、この人。</div>` : '';

  return `<div class="fade">
    ${progressHTML()}
    <h2 class="center">${c.icon} タネあかし<br><span class="small muted">${c.title}</span></h2>
    ${failHTML()}

      <h3>どうやって</h3><p>${plain(c.how)}</p>
    </div>
    <div class="actions"><button class="btn primary" data-act="next">${last?'七つのタネをあかした ▶':'つぎの怪談へ ▶'}</button></div>
  </div>`;
}

function rEighth(){
  return `<div class="fade">
    ${progressHTML()}
    <div class="case-no center">最後の問題</div>
    <h2 class="center">八つめの不思議</h2>
    <div class="box tale"><div class="label">なぞ</div><p>七つの怪談のタネは、ぜんぶあかした。<br>でも、ひとつだけ、まだ説明のつかないことがある。</p><p><b>${EIGHTH.question}</b></p></div>
    ${witnessCards(EIGHTH.choices, w=>zoomable(w.name, w.face||{}, faceSVG(w.name, w.face||{})), true)}
    ${S.hintOn&&!S.hard?`<div class="box hint fade"><p>💡 <b>ヒント</b></p><p>${EIGHTH.hint}</p></div>`:''}
    ${triesHTML()}
    <div class="actions"><button class="btn primary" data-act="accuse8" ${S.sel===null?'disabled':''}>この人だ！</button></div>
  </div>`;
}

function rEighthOk(){
  const f = EIGHTH.choices[EIGHTH.answer];
  return `<div class="fade">
    ${progressHTML()}
    ${failHTML()}
    <div class="center">${faceSVG(f.name, f.face, 'big glowring')}</div>
    <h2 class="center">守衛の古川さん</h2>
    <p class="center muted small">七つの事件の「どうやって」を、もういちど。</p>
    <ul class="trace">${CASES.map((c,k)=>`<li><div class="t">その${KANJI[k]}　${c.title}</div>${lit(c.how.match(/[^。]*\[\[.*?\]\][^。]*。?/)[0])}</li>`).join('')}</ul>
    <div class="actions"><button class="btn primary" data-act="finale">次の朝 ▶</button></div>
  </div>`;
}

function rFinale(){
  return `<div class="fade">
    <div class="pic">✉️</div>
    <p>${FINALE.intro}</p>
    <div class="letter">${FINALE.letter.map(l=>`<p>${l}</p>`).join('')}<p class="sign">${FINALE.sign}</p></div>
    <div class="eighth">${FINALE.eighth}</div>
    <div class="actions"><button class="btn primary" data-act="result">けっかを見る ▶</button></div>
  </div>`;
}

function rankOf(m){
  if (m===0) return '夜の学校の名探偵';
  if (m<=3) return '新聞部のエース記者';
  if (m<=7) return '七不思議ハンター';
  return 'こわがりの見習い記者';
}

function shareURL(){
  const lines = [
    `『七不思議のタネあかし』${S.hard?'（むずかしいモード）':''}で、${S.results.filter(Boolean).length===8?'八つの不思議をぜんぶあかしました！':'八つの不思議に挑みました！'}`,
    (S.hard?`見やぶった数 ${S.results.filter(Boolean).length}/8／`:'') + `まちがい ${S.misses}回／称号：${rankOf(S.misses)}`,
    '#七不思議のタネあかし',
  ];
  const page = /^https?:/.test(location.href) ? location.href.split(/[?#]/)[0] : '';
  return 'https://x.com/intent/tweet?text=' + encodeURIComponent(lines.join('\n')) + (page?'&url='+encodeURIComponent(page):'');
}

function rResult(){
  return `<div class="fade center">
    <div class="night" style="height:170px"><div class="stars"></div><div class="moon"></div>
      <div class="school"><div class="wins">${'<i class="lit"></i>'.repeat(7)}</div></div></div>
    <h2>八つの不思議、ぜんぶタネあかし！</h2>
    <div class="box result">
      ${S.hard?`<p class="small" style="color:#ffd0e6">むずかしいモード</p><p>見やぶった数 <b>${S.results.filter(Boolean).length}</b> / 8</p>`:''}
      <p>まちがい <b>${S.misses}</b> 回</p>
      <p>称号：<b>${rankOf(S.misses)}</b></p>
    </div>
    <div class="actions">
      <a class="btn x" href="${shareURL()}" target="_blank" rel="noopener" data-share>𝕏 結果をシェア</a>
      <p class="small muted">シェア文には、答えは入りません。</p>
      ${S.hard?'':'<button class="btn hard" data-act="restartHard">むずかしいモードに挑戦</button>'}
      <button class="btn primary" data-act="restart">もういちど はじめから</button>
    </div>
  </div>`;
}

function render(){
  const fn = {title:rTitle, intro:rIntro, case:rCase, reveal:rReveal, eighth:rEighth, eighthOk:rEighthOk, finale:rFinale, result:rResult}[S.screen];
  app.innerHTML = fn();
  window.scrollTo({top:0});
}

function resetPick(){ S.sel=null; S.cleared=[]; S.hintOn=false; S.tries=0; S.failed=false; }
function openCase(){ S.screen='case'; resetPick(); render(); }
// まちがえたとき。むずかしいモードは選択肢を消さず、2回まちがえたら答えを見せて次へ
function wrongPick(n, failScreen){
  const k = S.sel;
  S.misses++; S.sel=null;
  if (S.hard){
    S.tries++;
    if (S.tries >= 2){ S.failed=true; S.results[n]=false; S.solved=n+1; S.screen=failScreen; render(); return; }
  } else { S.cleared.push(k); S.hintOn=true; }
  render();
  const b = app.querySelector(`[data-w="${k}"]`);
  if (b) b.classList.add('shake');
}
function newGame(hard){ Object.assign(S,{screen:'intro', hard, i:0, misses:0, solved:0, results:[]}); resetPick(); render(); }

app.addEventListener('click', e => {
  const z = e.target.closest('[data-z]');
  if (z){ e.stopPropagation(); openZoom(z.dataset.z); return; }
  const w = e.target.closest('[data-w]');
  if (w && !w.disabled){
    S.sel = +w.dataset.w;
    app.querySelectorAll('.witness').forEach(b=>b.classList.toggle('sel', b===w));
    const btn = app.querySelector('[data-act^="accuse"]'); if (btn) btn.disabled = false;
    return;
  }
  const a = e.target.closest('[data-act]');
  if (!a) return;
  switch (a.dataset.act){
    case 'start': newGame(a.dataset.mode==='hard'); break;
    case 'toCase': S.i=0; openCase(); break;
    case 'accuse':
      if (S.sel===null) return;
      if (S.sel === caseOf(S.i).culprit){ S.results[S.i]=true; S.solved = S.i+1; S.screen='reveal'; render(); }
      else wrongPick(S.i, 'reveal');
      break;
    case 'next':
      if (S.i < CASES.length-1){ S.i++; openCase(); }
      else { S.screen='eighth'; resetPick(); render(); }
      break;
    case 'accuse8':
      if (S.sel===null) return;
      if (S.sel === EIGHTH.answer){ S.results[7]=true; S.solved = 8; S.screen='eighthOk'; render(); }
      else wrongPick(7, 'eighthOk');
      break;
    case 'finale': S.screen='finale'; render(); break;
    case 'result': S.screen='result'; render(); break;
    case 'restartHard': newGame(true); break;
    case 'restart': Object.assign(S,{screen:'title', hard:false}); render(); break;
  }
});

render();
</script>
</body>
</html>
